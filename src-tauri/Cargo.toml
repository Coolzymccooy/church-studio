[package]
name = "tiwaton-ai-studio"
version = "1.5.1"
description = "AI-powered church audio processing workstation"
authors = ["TIWATON"]
license = "MIT"
repository = "https://github.com/Coolzymccooy/church-studio"
edition = "2021"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"

# ── Native audio I/O ─────────────────────────────────────────────────────────
cpal = "0.18"

# ── DSP ──────────────────────────────────────────────────────────────────────
rustfft = "6"          # FFT for spectral processing
atomic_float = "1.0"   # AtomicF32 for lock-free param sharing
ringbuf = "0.4"        # Lock-free ring buffer (input→output)
parking_lot = "0.12"   # Fast mutex for noise profile transfers
# RNNoise neural denoiser (pure Rust). Default features pull in CLI-only deps.
nnnoiseless = { version = "0.5", default-features = false }

# ── Tiwaton Link (loopback HTTP server for Lumina) ───────────────────────────
# axum 0.7 (MSRV 1.66) on the tokio runtime Tauri already ships; only the
# features the server uses. getrandom 0.2 (MSRV 1.36) for the per-install token.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.2"

# ── OBS Studio control (obs-websocket v5) ────────────────────────────────────
# obws 0.14 declares MSRV 1.70 (0.15 needs 1.89). Runs on Tauri's tokio runtime.
obws = { version = "0.14", features = ["events"] }
futures-util = "0.3"   # StreamExt for the obws event stream

# tokio is already in the tree via tauri: net/sync for Link, time for OBS.
tokio = { version = "1", features = ["net", "sync", "time"] }

# ── NDI (runtime-loaded; nothing linked at build time) ───────────────────────
libloading = "0.8"
# This machine's name, to recognise our own NDI sources (already in the lock file).
gethostname = "1.1"

# ── Recording export (MP3) ───────────────────────────────────────────────────
# LAME 3.100, built from the bundled C source (LGPL; see
# docs/THIRD_PARTY_NOTICES.md). 0.2.x uses mp3lame-sys 0.1 = LAME 3.100, the
# last stable release (0.3 bundles an unreleased 4.0 snapshot).
mp3lame-encoder = "0.2.5"

# ── Network audio (docs/specs/2026-11-20-network-audio-design.md) ────────────
# Packet signing, pure Rust (sha2 is already in the lock file).
hmac = "0.12"
sha2 = "0.10"
# A large UDP receive buffer, so a Wi-Fi burst is not dropped (already in the
# tree through tokio).
socket2 = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# A mock Tauri app for the engine hot-plug probe (test builds only).
tauri = { version = "2", features = ["test"] }

# ── Computer audio on macOS (Core Audio process tap) ─────────────────────────
# The same objc2 bindings cpal 0.18 already pulls in; nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.1", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFNumber", "CFURL"] }
# AAC (.m4a) export through ExtAudioFile; already in the tree through cpal.
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AudioConverter", "AudioFile", "ExtendedAudioFile", "objc2-core-audio-types", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSUUID"] }

# AAC (.m4a) export through Media Foundation's sink writer on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
